<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starting to use CSS</title>
    <style> 
        p {
            color:rgb(0, 0, 0); font-size: 15px; font-weight: bold; font-family: times, sans-serif;
        }
    </style> <!-- The <style> tag is used to define internal CSS styles for the HTML document. In this case, it targets all <p> elements and applies the specified styles: beige color, font size of 20 pixels, bold font weight, and Arial font family with a fallback to sans-serif. -->
    <link rel="stylesheet" href="styles.css"> <!-- An example of this is visible in the "StylesheetCSS" folder, where I´ve use Anthropic´s stylesheet, AI generated by Gemini. This is usually the preferred approach for managing CSS styles in larger projects, and almost always recommended. -->
</head>
<body>
    
    <h1 style= "color: brown;">Starting to use CSS</h1> <!-- The style attribute is used to apply CSS styles directly to an HTML element. In this case, it changes the color of the heading text to brown. -->

    <p>This is a paragraph of text that will be styled using CSS. CSS allows you to change the appearance of HTML elements, including their color, font, size, and layout.</p>

</body>
</html>
