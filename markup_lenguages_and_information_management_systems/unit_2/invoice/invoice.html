<html lang= "en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My first invoice </title>
</head>
<body>

    <table border="1">
        <caption> Invoice </caption>
        <thead>
            <tr>
                <th> Item </th>
                <th> Quantity </th>
                <th> Price </th>
                <th> Total </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td> Item 1 </td>
                <td> 2 </td>
                <td> $10.00 </td>
                <td> $20.00 </td>
            </tr>
            <tr>
                <td> Item 2 </td>
                <td> 1 </td>
                <td> $15.00 </td>
                <td> $15.00 </td>
            </tr>
            <tr>
                <td colspan="3"> Total </td>
                <td> $35.00 </td>
            </tr>
        </tbody>    

        <tfoot>
            <tr>
                <td colspan="4"> Thank you for your business! </td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
