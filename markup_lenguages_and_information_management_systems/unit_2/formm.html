<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Example</title>
</head>
<body>
    <form action="submit_form.php" method="post" enctype="multipart/form-data"> <!-- The enctype attribute specifies how the form data should be encoded when submitting it to the server, it is necessary when uploading files -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>

        <label for = "file"> Upload a file </label>
        <input type = "file" name = "file" id = "file"><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
