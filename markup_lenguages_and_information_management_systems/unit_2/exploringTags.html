<html lang= "en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> HTML Tags Exploration </title>
</head>
<body>
    <h1>HTML Tags Exploration</h1>
    <p>This is a simple paragraph to demonstrate the use of HTML tags. <strong> This is bold text </strong> <em> This is italic text </em> </p> <!-- This is a block tag -->
    <br> <!-- This is a line break tag, we can even use two in a row -->
    <hr> <!-- This is a horizontal rule tag -->
    <strong> This is bold text </strong>
    <em> This is italic text </em>
    <a href= "https://www.nasa.gov/marshall/marshall-space-flight-center-history/"> Marshall </a>  <!-- These last 3 tags are not block tags, that´s why they don´t start on a new line -->
    <br>
    <mark> This is a marked text </mark>
    <small> This is small text </small>
    <br> <br>
    <code>
        import Scanner.io;

    </code> <!-- This is a code tag, to be used for displaying code snippets -->
    <br>
    <p>H<sub>2</sub>0</p>

</body>
</html>
